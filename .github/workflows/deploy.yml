name: Deploy documentation

on:
  push:
    branches: [main]
  # Permite lanzar el deploy a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos que necesita GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; los pushes nuevos cancelan el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site + search index
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita GitHub Pages en el repo si todavía no lo está,
          # así no hace falta tocar Settings a mano.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
